<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #E8E8E8; }
      #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: 'Montserrat', Arial, sans-serif; }
      #bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, #F7F7F7, #D9DCE2 75%); }
      #three-layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
      .label { position: absolute; left: 0; width: 1080px; top: 150px; text-align: center; font-weight: 900; font-size: 72px; color: #0F0F0F; letter-spacing: -0.02em; }
      .label b { color: #2563EB; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="character-preview" data-start="0" data-duration="9" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <canvas id="three-layer" class="clip" width="1080" height="1920" data-start="0" data-duration="9" data-track-index="0" data-layout-allow-overflow></canvas>
      <div id="labels" class="clip" data-start="0" data-duration="9" data-track-index="1" data-layout-allow-overlap>
        <div id="l1" class="label"><b>MEET</b> THE HOST</div>
        <div id="l2" class="label"><b>NEXT</b> VIDEO STAR</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 9 }, 0);
      tl.fromTo("#l1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);
      tl.to("#l1", { opacity: 0, duration: 0.3 }, 4.0);
      tl.fromTo("#l2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.2);
      window.__timelines["character-preview"] = tl;
      tl.seek(0);
    </script>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";
      import { createAvatar } from "./avatar.js";

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("three-layer"), alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1080, 1920, false);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;

      const scene = new THREE.Scene();
      scene.add(new THREE.HemisphereLight(0xffffff, 0x9096a3, 1.2));
      const key = new THREE.DirectionalLight(0xffffff, 2.3);
      key.position.set(1.5, 3, 3); key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      Object.assign(key.shadow.camera, { left: -1, right: 1, top: 1.5, bottom: -0.5 });
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xbcd4ff, 1.3);
      rim.position.set(-3, 2, -3);
      scene.add(rim);
      const floor = new THREE.Mesh(new THREE.CircleGeometry(0.6, 64), new THREE.ShadowMaterial({ opacity: 0.18 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
      scene.add(floor);

      const avatar = createAvatar(THREE);
      scene.add(avatar.group);
      const camera = new THREE.PerspectiveCamera(30, 1080 / 1920, 0.01, 50);

      const smooth = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
      const lerp = (a, b, t) => a + (b - a) * t;

      function renderAt(t) {
        // 0-4s: turntable in idle; 4-6.2s: peace sign + push in to the face; 6.2-9s: wave, pull back
        avatar.group.rotation.y = t < 4 ? (t / 4) * Math.PI * 2 : lerp(0, 0.35, smooth((t - 4) / 0.6)) - 0.35 * smooth((t - 6.2) / 0.6);
        let p = "idle";
        if (t >= 4 && t < 6.2) p = avatar.blend("idle", "peace", smooth((t - 4) / 0.5));
        else if (t >= 6.2) {
          const w = avatar.blend("peace", "wave", smooth((t - 6.2) / 0.5));
          if (t > 6.7) w.wristR = [0, Math.PI, 0.35 * Math.sin((t - 6.7) * 9)];
          p = w;
        }
        avatar.pose(p);
        avatar.group.position.y = t < 4 ? 0.012 * Math.abs(Math.sin(t * Math.PI)) : 0;

        const zoom = smooth((t - 4.2) / 0.8) * (1 - smooth((t - 6.2) / 0.8));
        camera.position.set(0, lerp(0.62, 0.85, zoom), lerp(3.1, 1.25, zoom));
        camera.lookAt(0, lerp(0.5, 0.78, zoom), 0);
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      const root = window.__timelines["character-preview"];
      root.eventCallback("onUpdate", () => renderAt(root.time()));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
