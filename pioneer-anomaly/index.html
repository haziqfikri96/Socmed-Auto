    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const LINES = window.LINES, D = window.D, DUR = D.DUR, C = D.cues, DRAFT = !!window.HF_DRAFT;
      const $ = (id) => document.getElementById(id);
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
      const seg = (t, a, b) => smooth((t - a) / (b - a));
      const expoOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(x, 0, 1)));
      const backOut = (x, c1 = 1.7) => { x = clamp(x, 0, 1); const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
      const lerp = (a, b, k) => a + (b - a) * k;
      const lerp3 = (A, B, k) => A.map((v, i) => lerp(v, B[i], k));
      const bell = (t, a, b) => (t <= a || t >= b ? 0 : Math.sin(Math.PI * (t - a) / (b - a)));
      const rng = (seed) => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

      /* ---------- renderer / post ---------- */
      const W = DRAFT ? 540 : 1080, H = DRAFT ? 960 : 1920;
      const renderer = new THREE.WebGLRenderer({ canvas: $("three"), antialias: !DRAFT, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
      const scene = new THREE.Scene(); scene.background = new THREE.Color(0x01030a);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.35;
      const camera = new THREE.PerspectiveCamera(36, 1080 / 1920, 0.02, 400);
      const composer = new EffectComposer(renderer); composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.55, 0.5, 0.8); composer.addPass(bloom);
      composer.addPass(new OutputPass());

      function canvasTex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx; }
      const glowTex = canvasTex(128, 128, (g) => { const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.25, "rgba(255,255,255,0.55)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); });
      const ringTex = canvasTex(256, 256, (g) => { const gr = g.createRadialGradient(128, 128, 90, 128, 128, 126); gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(0.55, "rgba(255,255,255,1)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); });

      /* ---------- deep space: stars, sun light ---------- */
      { const R = rng(3), n = 2600, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) { const u = R() * 2 - 1, a = R() * 6.283, r = 150; const s = Math.sqrt(1 - u * u);
          pos.set([Math.cos(a) * s * r, u * r, Math.sin(a) * s * r], i * 3); const b = 0.35 + Math.pow(R(), 4) * 0.9, w = R(); col.set([b * (0.85 + 0.15 * w), b * 0.92, b * (1.05 - 0.2 * w)], i * 3); }
        const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("color", new THREE.BufferAttribute(col, 3));
        scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: DRAFT ? 1.6 : 2.6, sizeAttenuation: false, vertexColors: true, fog: false }))); }
      const sunLight = new THREE.DirectionalLight(0xfff1dc, 2.4); sunLight.position.set(-10, 2.5, 3); scene.add(sunLight);   // the Sun is toward -X
      scene.add(new THREE.HemisphereLight(0x5c7cff, 0x050608, 0.25));
      const rim = new THREE.DirectionalLight(0x7fd8ff, 0.8); rim.position.set(6, 3, -6); scene.add(rim);

      /* ---------- gas giant with a faint ring (hook backdrop) ---------- */
      const planetTex = canvasTex(1024, 512, (g, w, h) => { const R = rng(11); const cols = ["#d9b98c", "#b98a5e", "#e8d3b0", "#a0704a", "#cfae84", "#8c5d3c", "#e3c9a0"];
        for (let y = 0; y < h; y += 4) { const band = Math.floor((Math.sin(y * 0.045) + Math.sin(y * 0.013 + 1.3) + 2) * 1.6) % cols.length; g.fillStyle = cols[band]; g.fillRect(0, y, w, 4); }
        for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(255,240,220,${R() * 0.08})`; g.fillRect(R() * w, R() * h, 20 + R() * 120, 2 + R() * 3); }
        g.fillStyle = "rgba(190,80,50,0.75)"; g.beginPath(); g.ellipse(w * 0.62, h * 0.62, 46, 22, 0, 0, 7); g.fill(); });
      const planet = new THREE.Mesh(new THREE.SphereGeometry(7, 96, 64), new THREE.MeshStandardMaterial({ map: planetTex, roughness: 0.9, metalness: 0 }));
      planet.position.set(6, -3.5, -24); planet.rotation.z = 0.06; scene.add(planet);
      const ringAlpha = canvasTex(512, 8, (g, w) => { for (let x = 0; x < w; x++) { const r = x / w; const a = (0.35 + 0.65 * Math.abs(Math.sin(r * 13 + 0.6))) * Math.sin(Math.PI * r) * 0.7; g.fillStyle = `rgba(255,255,255,${a})`; g.fillRect(x, 0, 1, 8); } });
      const ringGeo = new THREE.RingGeometry(9, 15, 160, 1); { const p = ringGeo.attributes.position, uv = ringGeo.attributes.uv; for (let i = 0; i < p.count; i++) { const r = Math.hypot(p.getX(i), p.getY(i)); uv.setXY(i, (r - 9) / 6, 0.5); } }
      const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffd7a8, alphaMap: ringAlpha, map: ringAlpha, transparent: true, side: THREE.DoubleSide, depthWrite: false, opacity: 0.5 }));
      ring.position.copy(planet.position); ring.rotation.set(-Math.PI / 2 + 0.32, 0.12, 0.2); scene.add(ring);

      /* ---------- Pioneer 10 (dish axis along X; the dish faces the Sun/Earth at -X) ---------- */
      const probe = new THREE.Group(); scene.add(probe);
      const mats = [];
      const M = (o) => { const m = new THREE.MeshStandardMaterial(o); mats.push(m); return m; };
      const dishMat = M({ color: 0xe6e9ee, metalness: 0.65, roughness: 0.32, side: THREE.DoubleSide });
      const goldMat = M({ color: 0xd3a447, metalness: 1, roughness: 0.38 });
      const steelMat = M({ color: 0x9aa3ad, metalness: 0.9, roughness: 0.35 });
      const rtgMat = M({ color: 0x3b3f45, metalness: 0.8, roughness: 0.45, emissive: 0xff5a1f, emissiveIntensity: 0 });
      const F = 0.45, prof = []; for (let i = 0; i <= 24; i++) { const r = (i / 24) * 1.0; prof.push(new THREE.Vector2(r, (r * r) / (4 * F))); }
      const dish = new THREE.Mesh(new THREE.LatheGeometry(prof, 72), dishMat); dish.rotation.z = Math.PI / 2; probe.add(dish);   // concave side -> -X
      const DISH_RIM_X = -1 / (4 * F);
      const rimRing = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.012, 8, 96), steelMat); rimRing.rotation.y = Math.PI / 2; rimRing.position.x = DISH_RIM_X; probe.add(rimRing);
      const feed = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.16, 16), goldMat); feed.rotation.z = Math.PI / 2; feed.position.x = -F; probe.add(feed);
      for (let k = 0; k < 3; k++) { const a = k * 2.094 + 0.5, from = new THREE.Vector3(DISH_RIM_X * 0.55, Math.cos(a) * 0.6, Math.sin(a) * 0.6), to = new THREE.Vector3(-F, 0, 0);
        const len = from.distanceTo(to), s = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, len, 6), steelMat); s.position.copy(from).add(to).multiplyScalar(0.5); s.lookAt(to); s.rotateX(Math.PI / 2); probe.add(s); }
      const bus = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.34, 6), goldMat); bus.rotation.z = Math.PI / 2; bus.position.x = 0.2; probe.add(bus);   // hexagonal equipment compartment
      const busCore = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.24, 6), new THREE.MeshBasicMaterial({ color: 0xff7a2a, transparent: true, opacity: 0 })); busCore.rotation.z = Math.PI / 2; busCore.position.x = 0.2; probe.add(busCore);
      const rtgCores = [], rtgPos = [];
      function boom(angle, len, withRtg) {
        const dir = new THREE.Vector3(0, Math.cos(angle), Math.sin(angle)), base = new THREE.Vector3(0.22, 0, 0).add(dir.clone().multiplyScalar(0.3));
        const end = base.clone().add(dir.clone().multiplyScalar(len)).add(new THREE.Vector3(0.1, 0, 0));
        for (const off of [-0.03, 0.03]) { const a = base.clone().add(new THREE.Vector3(off, 0, 0)), b = end.clone().add(new THREE.Vector3(off, 0, 0));
          const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, a.distanceTo(b), 6), steelMat); rod.position.copy(a).add(b).multiplyScalar(0.5); rod.lookAt(b); rod.rotateX(Math.PI / 2); probe.add(rod); }
        if (!withRtg) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), steelMat); s.position.copy(end); probe.add(s); return; }
        for (const f of [0.78, 0.97]) {                                   // two finned RTG units per boom
          const c = base.clone().lerp(end, f), u = new THREE.Group(); u.position.copy(c); u.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); probe.add(u);
          u.add(new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.24, 16), rtgMat));
          for (let k = 0; k < 6; k++) { const fin = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.22, 0.012), rtgMat); fin.rotation.y = k * Math.PI / 3; u.add(fin); }
          const core = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.25, 12), new THREE.MeshBasicMaterial({ color: 0xff6a20, transparent: true, opacity: 0 })); u.add(core); rtgCores.push(core); rtgPos.push(c);
        }
      }
      boom(0.35, 1.45, true); boom(0.35 + 2.094, 1.45, true); boom(0.35 + 4.189, 2.6, false);   // two RTG booms + magnetometer boom
      // x-ray overlay: cyan wireframe twins of every solid part
      const wireMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0, depthWrite: false });
      { const solids = []; probe.traverse((o) => { if (o.isMesh && mats.includes(o.material)) solids.push(o); });
        for (const o of solids) { const w = new THREE.Mesh(o.geometry, wireMat); o.add(w); } }

      // drag vector (hook), recoil arrows (x-ray / photon)
      function arrow(color, len, rad) { const g = new THREE.Group(); const m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0 });
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, len, 12), m); shaft.position.y = len / 2; g.add(shaft);
        const head = new THREE.Mesh(new THREE.ConeGeometry(rad * 2.8, rad * 6, 16), m); head.position.y = len + rad * 3; g.add(head); g.userData.m = m; return g; }
      const drag = arrow(0xff2a2a, 1.7, 0.055); drag.rotation.z = Math.PI / 2; drag.position.set(DISH_RIM_X - 0.1, 0, 0); probe.add(drag);   // points -X (backward, sunward)
      const dragGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xff3030, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 })); dragGlow.position.set(DISH_RIM_X - 1.0, 0, 0); dragGlow.scale.set(2.4, 0.6, 1); probe.add(dragGlow);
      const recoil = [-0.5, 0, 0.5].map((y) => { const a = arrow(0x00e5ff, 0.55, 0.022); a.rotation.z = Math.PI / 2; a.position.set(0.5, y, 0.55); probe.add(a); return a; });

      // infrared: spherical shells from the RTGs + the bus, reflected wavefronts leaving the back of the dish (+X), photon particles
      const irShells = []; for (let i = 0; i < 12; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: ringTex, color: 0xff6a2a, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 })); probe.add(s); irShells.push(s); }
      const waveFronts = []; for (let i = 0; i < 5; i++) { const m = new THREE.Mesh(new THREE.TorusGeometry(1, 0.012, 6, 64, 1.6), new THREE.MeshBasicMaterial({ color: 0xff7a35, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
        m.rotation.z = -0.8; probe.add(m); waveFronts.push(m); }
      const R4 = rng(19), photons = [];
      for (let i = 0; i < 160; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: i % 5 ? 0xff7a35 : 0xffe2b0, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 }));
        probe.add(s); const a = R4() * 6.283, r = 0.55 + R4() * 0.45; photons.push([s, a, r, R4(), 0.5 + R4() * 0.7, (R4() - 0.5) * 0.25]); }

      /* ---------- trajectory diagram (shot 2), in its own place far above ---------- */
      const traj = new THREE.Group(); traj.position.set(0, 80, 0); scene.add(traj);
      const sun = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 16), new THREE.MeshBasicMaterial({ color: 0xffd27a })); traj.add(sun);
      const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffb347, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); sunGlow.scale.setScalar(4); traj.add(sunGlow);
      for (const [r, c] of [[1.4, 0x4fa3ff], [3.6, 0xd9b98c], [5.6, 0xe8d3b0]]) { const pts = []; for (let i = 0; i <= 128; i++) pts.push(new THREE.Vector3(Math.cos(i / 128 * 6.283) * r, 0, Math.sin(i / 128 * 6.283) * r));
        traj.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x3a5a80, transparent: true, opacity: 0.55 })));
        const p = new THREE.Mesh(new THREE.SphereGeometry(r > 2 ? 0.22 : 0.1, 16, 12), new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 })); p.position.set(Math.cos(r) * r, 0, Math.sin(r) * r); traj.add(p); }
      const pathPt = (s) => { const a = 0.5 + s * 1.9, r = 1.4 + Math.pow(s, 1.15) * 12; return new THREE.Vector3(Math.cos(a) * r, 0.04, Math.sin(a) * r); };
      const pathCurve = new THREE.CatmullRomCurve3(Array.from({ length: 60 }, (_, i) => pathPt(i / 59)));
      const stripe = canvasTex(64, 4, (g) => { g.fillStyle = "#fff"; g.fillRect(0, 0, 36, 4); }); stripe.wrapS = THREE.RepeatWrapping; stripe.repeat.set(70, 1);
      const predTube = new THREE.Mesh(new THREE.TubeGeometry(pathCurve, 400, 0.07, 8), new THREE.MeshBasicMaterial({ color: 0x00e5ff, alphaMap: stripe, alphaTest: 0.5 })); predTube.renderOrder = 2; traj.add(predTube);
      const actCurve = new THREE.CatmullRomCurve3(Array.from({ length: 60 }, (_, i) => pathPt(i / 59 * 0.93).multiplyScalar(0.975)));
      const actTube = new THREE.Mesh(new THREE.TubeGeometry(actCurve, 400, 0.07, 8), new THREE.MeshBasicMaterial({ color: 0xff9f1c })); traj.add(actTube);
      const mkPred = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x00e5ff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); traj.add(mkPred);
      const mkAct = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xff9f1c, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); traj.add(mkAct);
      const gapLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xffd29a })); traj.add(gapLine);

      /* ---------- camera direction ---------- */
      const P0 = new THREE.Vector3(5, 0, 0);    // probe rest position for shots 3–5
      const shotAt = (t) => { let i = 0; while (i < D.shots.length - 1 && t >= D.shots[i + 1][0]) i++; return [i, D.shots[i][0], D.shots[i + 1] ? D.shots[i + 1][0] : DUR]; };
      const hookProbe = (tt) => new THREE.Vector3(-1.2 + 0.55 * tt, 0.1 * Math.sin(tt * 0.6), 0);
      function hookCam(tt) { const p = hookProbe(tt), k = smooth(tt / 5); return [[p.x - 2.6 + 0.9 * k, p.y + 1.0 - 0.2 * k, 6.4 - 1.1 * k], [p.x + 0.9, p.y - 0.9, -2.5]]; }

      function renderAt(t) {
        let [i, a, b] = shotAt(t), name = D.shots[i][1], u = (t - a) / (b - a);
        const looping = t >= C.loop, lw = looping ? seg(t, C.loop, DUR - 0.02) : 0;
        if (looping) name = "hook";
        let pos, tgt, whip = 0, xray = 0, heat = 0, waves = 0, phot = 0, dragOn = 0, recoilOn = 0, shells = -1;
        probe.visible = true; traj.visible = false; planet.visible = ring.visible = true; camera.up.set(0, 1, 0);
        probe.rotation.set(0, 0, 0);

        if (name === "hook") {
          const tt = looping ? t - DUR : t;
          probe.position.copy(hookProbe(tt)); probe.rotation.x = 0.2 + tt * 0.08;
          [pos, tgt] = hookCam(tt);
          if (looping) { pos = [pos[0] + 1.2 * (1 - lw), pos[1], pos[2]]; whip = bell(t, C.loop, DUR + 0.02); }
          dragOn = looping ? 0 : seg(t, C.drag, C.drag + 0.35);
        } else if (name === "traj") {
          probe.visible = false; traj.visible = true; planet.visible = ring.visible = false;
          const k = smooth(u); pos = [lerp(-4.2, -4.8, k), 80 + lerp(34, 30, k), lerp(8.6, 8.2, k)]; tgt = [lerp(-4.6, -5.2, k), 80, lerp(4.6, 5.0, k)]; camera.up.set(-0.79, 0, 0.61);
          whip = bell(t, a - 0.05, a + 0.3);
        } else {
          probe.position.copy(P0); probe.rotation.x = 0.35 + t * 0.03;
          planet.visible = ring.visible = name === "payoff";
          if (name === "xray") {
            const k = smooth(u); pos = [P0.x + lerp(-2.4, 0.9, k), lerp(0.9, 1.2, k), lerp(4.2, 3.9, k)]; tgt = [P0.x + lerp(0.1, -0.35, k), 0, 0];
            xray = seg(t, C.xray, C.xray + 0.5); heat = seg(t, C.heat, C.heat + 0.6); waves = seg(t, C.heat + 0.3, C.heat + 0.9); recoilOn = seg(t, C.dish, C.dish + 0.4);
            whip = bell(t, a - 0.05, a + 0.3);
          } else if (name === "photon") {
            probe.rotation.x = 0.0;
            const k = smooth(u); pos = [P0.x + lerp(0.6, 0.8, k), lerp(0.35, 0.25, k), lerp(4.4, 3.7, k)]; tgt = [P0.x + lerp(0.55, 0.75, k), 0.05, 0];
            xray = 1 - seg(t, a, a + 0.8) * 0.65; heat = 1; waves = 0.5; shells = 0.25; phot = seg(t, a, a + 0.5); recoilOn = 0.35 + 0.5 * seg(t, C.backward, C.backward + 0.3);
          } else {   // payoff
            const k = smooth((t - a) / 2.2); pos = [P0.x + lerp(-1.6, -3.4, k), lerp(0.7, 1.3, k), lerp(2.4, 5.2, k)]; tgt = [P0.x + 0.2, 0, 0];
            heat = 0.5; phot = 0.4; waves = 0.25; whip = bell(t, a - 0.05, a + 0.3);
          }
        }
        camera.position.set(...pos); camera.lookAt(...tgt); if (whip > 0.02) camera.rotateZ(whip * 0.05); camera.updateMatrixWorld();

        // materials: x-ray look
        for (const m of mats) { m.transparent = xray > 0.01; m.opacity = lerp(1, 0.16, xray); m.depthWrite = xray < 0.5; }
        rtgMat.emissiveIntensity = 2.2 * heat; wireMat.opacity = 0.45 * xray;
        rtgCores.forEach((c) => { c.material.opacity = heat * (0.75 + 0.25 * Math.sin(t * 7)); });
        busCore.material.opacity = heat * 0.55;
        drag.userData.m.opacity = dragOn * (0.75 + 0.25 * Math.sin(t * 9)); dragGlow.material.opacity = dragOn * 0.55; drag.scale.setScalar(0.6 + 0.4 * dragOn + 0.05 * Math.sin(t * 9));
        recoil.forEach((r, k) => { r.userData.m.opacity = recoilOn * (0.7 + 0.3 * Math.sin(t * 6 + k)); r.position.x = 0.5 - 0.25 * ((t * 1.2 + k * 0.3) % 1) * recoilOn; });
        // spherical infrared shells from the 4 RTGs and the bus
        irShells.forEach((s, k) => { const src = k < 8 ? rtgPos[k % 4] : new THREE.Vector3(0.2, 0, 0); const p = ((t * 0.55 + k * 0.137) % 1);
          s.position.copy(src); const sc = 0.15 + 1.5 * p; s.scale.set(sc, sc, 1); s.material.opacity = (shells >= 0 ? shells : heat) * (1 - p) * 0.55; });
        // reflected wavefronts leave the back of the dish toward +X (away from the Sun)
        waveFronts.forEach((m, k) => { const p = ((t * 0.45 + k / 5) % 1); m.position.set(0.35 + p * 2.4, 0, 0); m.scale.setScalar(0.5 + p * 1.4); m.material.opacity = waves * (1 - p) * 0.9; });
        // photons streaming off the dish toward +X
        photons.forEach(([s, ang, r, off, sp, dz]) => { const p = ((t * 0.5 * sp + off) % 1); const x = 0.05 + (r * r) / (4 * F) * -1 + 0.1 + p * 1.8;
          s.position.set(x + 0.2, Math.cos(ang) * r * (1 + p * 0.25), Math.sin(ang) * r * (1 + p * 0.25) + dz * p); const sc = 0.022 + 0.014 * (1 - p); s.scale.set(sc * 2.4, sc, 1);
          s.material.opacity = phot * Math.sin(Math.PI * p) * 0.95; });

        // trajectory: draw the paths, then show the gap
        if (traj.visible) { const k = seg(t, a + 0.2, a + 2.4); const n = predTube.geometry.index.count, m = actTube.geometry.index.count;
          predTube.geometry.setDrawRange(0, Math.floor(n * k / 6) * 6); actTube.geometry.setDrawRange(0, Math.floor(m * k / 6) * 6);
          const pp = pathCurve.getPoint(k), pa = actCurve.getPoint(k); mkPred.position.copy(pp); mkAct.position.copy(pa); mkPred.scale.setScalar(0.9 + 0.15 * Math.sin(t * 8)); mkAct.scale.setScalar(0.9 + 0.15 * Math.sin(t * 8 + 1));
          gapLine.geometry.setFromPoints([pp, pa]); gapLine.material.opacity = 1; }

        composer.render();
        hud(t, name, whip, lw, looping);
      }

      /* ---------- HUD ---------- */
      const _v = new THREE.Vector3();
      const proj = (v) => { _v.copy(v).project(camera); return [(_v.x + 1) / 2 * 1080, (1 - _v.y) / 2 * 1920, _v.z < 1]; };
      const place = (id, x, y, op, sc = 1) => { const el = $(id), w = el.offsetWidth, h = el.offsetHeight; const cx = clamp(x, 80 + w / 2, 940 - w / 2), cy = clamp(y, 180 + h / 2, 1600 - h / 2);
        el.style.opacity = op; el.style.transform = `translate(${(cx - w / 2).toFixed(1)}px, ${(cy - h / 2).toFixed(1)}px) scale(${sc.toFixed(3)})`; };
      const lineAt = (t) => { let i = 0; while (i < LINES.length - 1 && t >= LINES[i + 1].s - 0.05) i++; return i; };
      function hud(t, name, whip, lw, looping) {
        // hook banner (pops on frame 1)
        const hk = $("hook"), hOn = !looping && t < 3.4;
        hk.style.opacity = hOn ? 1 - seg(t, 3.15, 3.4) : 0; hk.style.transform = `translate(-50%, -50%) scale(${(1.18 - 0.18 * expoOut(t / 0.22)).toFixed(3)})`;
        // drag tag
        { const w = new THREE.Vector3(DISH_RIM_X - 1.1, 0.25, 0).applyMatrix4(probe.matrixWorld); const [x, y] = proj(w); place("tDrag", x, y - 70, name === "hook" && !looping ? seg(t, C.drag + 0.2, C.drag + 0.5) * (1 - seg(t, D.shots[1][0] - 0.2, D.shots[1][0])) : 0); }
        // trajectory labels
        const tOn = name === "traj" ? 1 - seg(t, D.shots[2][0] - 0.2, D.shots[2][0]) : 0;
        { const [px, py] = proj(mkPred.getWorldPosition(new THREE.Vector3())), [ax, ay] = proj(mkAct.getWorldPosition(new THREE.Vector3()));
          place("tPred", px + 190, py, tOn * seg(t, D.shots[1][0] + 0.8, D.shots[1][0] + 1.1)); place("tAct", ax - 170, ay + 40, tOn * seg(t, D.shots[1][0] + 1.0, D.shots[1][0] + 1.3));
          const bk = seg(t, C.behind, C.behind + 0.25); place("tBehind", (px + ax) / 2, Math.max(py, ay) + 150, tOn * bk, 1.25 - 0.25 * expoOut((t - C.behind) / 0.3) + 0.03 * Math.sin(t * 7) * bk); }
        // x-ray labels
        const xOn = name === "xray" ? seg(t, C.xray, C.xray + 0.3) * (1 - seg(t, D.shots[3][0] - 0.15, D.shots[3][0])) : 0;
        const br = $("bRecoil"); br.style.opacity = xOn; br.style.transform = `translateX(-50%) scale(${xOn ? (1.25 - 0.25 * expoOut((t - C.xray) / 0.3)).toFixed(3) : 1})`;
        { const [x, y] = proj(rtgPos[1].clone().applyMatrix4(probe.matrixWorld)); place("tRtg", x, y - 70, name === "xray" ? seg(t, C.heat, C.heat + 0.3) * (1 - seg(t, D.shots[3][0] - 0.15, D.shots[3][0])) : 0); }
        { const [x, y] = proj(new THREE.Vector3(0.0, -0.75, 0.55).applyMatrix4(probe.matrixWorld)); place("tSun", x, y + 50, name === "xray" ? seg(t, C.dish, C.dish + 0.3) : 0); }
        // acceleration label (photon shot)
        const ac = $("accel"); const aOn = name === "photon" ? seg(t, C.accel, C.accel + 0.3) : 0; ac.style.opacity = aOn; ac.style.transform = `translateX(-50%) scale(${(1 + 0.04 * Math.sin(t * 5) * aOn).toFixed(3)})`;
        // solved badge
        const sOn = name === "payoff" && !looping ? seg(t, C.solved, C.solved + 0.2) : 0; const bs = $("bSolved");
        bs.style.opacity = sOn * (1 - seg(t, C.loop - 0.12, C.loop)); bs.style.transform = `translateX(-50%) scale(${sOn ? (1.4 - 0.4 * backOut((t - C.solved) / 0.3, 2.2)).toFixed(3) : 1})`;
        // x-ray scan line
        const sc = name === "xray" && t >= C.xray && t < C.xray + 0.5 ? (t - C.xray) / 0.5 : -1; $("scan").style.opacity = sc >= 0 ? 1 : 0; $("scan").style.top = (180 + 1420 * Math.max(0, sc)).toFixed(0) + "px";
        $("smear").style.opacity = clamp(whip, 0, 1).toFixed(3);
        // captions: word by word, ≤3 words / ≤20 chars, cyan active word, gone when the voice stops
        const L = LINES[lineAt(t)], on = t >= L.s - 0.03 && t < L.e;
        $("cap").style.opacity = on ? 1 : 0;
        if (on) { const ws = L.words, chunks = [[]];
          ws.forEach((w, j) => { let cur = chunks[chunks.length - 1]; const len = cur.reduce((n, i) => n + ws[i].w.length + 1, 0);
            if (cur.length && len + w.w.length > 20) { chunks.push([]); cur = chunks[chunks.length - 1]; }
            cur.push(j); if (/[.,!?:]$/.test(w.w) || cur.length >= 3) chunks.push([]); });
          let act = ws.findIndex((w) => t < w.e); if (act < 0) act = ws.length - 1;
          const ch = chunks.find((c) => c.includes(act)) || chunks[0];
          $("cap").innerHTML = '<span class="ch">' + ch.map((j) => `<span class="${j === act && t >= ws[j].s ? "on" : ""}">${ws[j].w}</span>`).join(" ") + "</span>"; }
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      const root = window.__timelines["pioneer-anomaly"];
      root.eventCallback("onUpdate", () => renderAt(root.time()));
      renderAt(window.__hfThreeTime || root.time() || 0);
    </script>
  </body>
