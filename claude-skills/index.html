      const SH = D.shots.map((s) => s[0]), shotOf = (t) => { let i = 0; while (i < SH.length - 1 && t >= SH[i + 1]) i++; return D.shots[i][1]; };

      /* ---------- renderer: obsidian lab ---------- */
      const W = DRAFT ? 540 : 1080, H = DRAFT ? 960 : 1920;
      const renderer = new THREE.WebGLRenderer({ canvas: $("three"), antialias: !DRAFT, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

      function canvasTex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); if (draw) draw(g, w, h); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4; return { c, g, tx }; }

      const shafts = [[-2.6, 0x00e5ff], [2.4, 0x7a5cff], [0.2, 0x00e5ff]].map(([x, c], i) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 9), new THREE.MeshBasicMaterial({ map: shaftT, color: c, transparent: true, opacity: 0.09, depthWrite: false, blending: THREE.AdditiveBlending }));
        m.position.set(x, 2.8, -4 - i); m.rotation.z = 0.2 - i * 0.2; scene.add(m); return m; });
      // dust motes
      const R0 = rng(5), NM = 420, mPos = new Float32Array(NM * 3), mSeed = [];
      for (let i = 0; i < NM; i++) mSeed.push([(R0() - 0.5) * 16, R0() * 8 - 1.6, (R0() - 0.5) * 22 - 2, R0() * 6.28]);
      const motesGeo = new THREE.BufferGeometry(); motesGeo.setAttribute("position", new THREE.BufferAttribute(mPos, 3));
      scene.add(new THREE.Points(motesGeo, new THREE.PointsMaterial({ color: 0xbff8ff, size: DRAFT ? 0.035 : 0.03, transparent: true, opacity: 0.6, depthWrite: false })));
      // light rings the camera flies through
      const rings = [15.5, 12.5].map((z) => { const r = new THREE.Mesh(new THREE.TorusGeometry(3.4, 0.06, 12, 128), new THREE.MeshBasicMaterial({ color: 0x00e5ff, fog: false })); r.position.set(0, 1.1, z); scene.add(r); return r; });

      /* ---------- Quill ---------- */

      /* ---------- holographic panels (canvas-textured glass) ---------- */
      function panel(w, h, px, opts = {}) {
        const ct = canvasTex(Math.round(px * w / h), px);
        const g = new THREE.Group();
        const glass = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: opts.tint || 0x0b1a2a, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide }));
        const face = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: ct.tx, transparent: true, depthWrite: false, side: THREE.DoubleSide })); face.position.z = 0.005;
        const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)), new THREE.LineBasicMaterial({ color: opts.edge || 0x00e5ff, transparent: true }));
        g.add(glass, face, edge); scene.add(g);
        return { g, ct, glass, face, edge, w, h, set(o) { glass.material.opacity = 0.55 * o; face.material.opacity = o; edge.material.opacity = o; g.visible = o > 0.01; } };
      }
      const txt = (g, s, x, y, size, col, weight = 900, font = "Montserrat") => { g.font = `${weight} ${size}px ${font}`; g.fillStyle = col; g.fillText(s, x, y); };
      // shot 1: terminal with the kinetic headline
      const hook = panel(2.9, 1.95, 600); hook.g.position.set(-0.05, 1.75, 0); hook.g.rotation.y = 0.12;
      // shot 2: README stack + red timer
      const slabs = []; const SLAB = ["README.md", "GITHUB", "INSTALLATION.md", "README.md", "GEMINI.md", "README.md"];
      SLAB.forEach((name, i) => { const lab = canvasTex(512, 128, (g, w, h) => { g.fillStyle = "#1c2230"; g.fillRect(0, 0, w, h); g.strokeStyle = name === "README.md" ? "#ff5a5a" : "#3a4458"; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
          g.font = "800 56px JetBrains Mono"; g.fillStyle = name === "README.md" ? "#ffb0b0" : "#c8d2e4"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(name, w / 2, h / 2 + 2); }).tx;
        const side = new THREE.MeshStandardMaterial({ color: 0x232a38, roughness: 0.55, metalness: 0.4 }), front = new THREE.MeshStandardMaterial({ map: lab, roughness: 0.5, metalness: 0.2, emissive: 0xffffff, emissiveMap: lab, emissiveIntensity: 0.35 });
        const m = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.5, 0.9), [side, side, side, side, front, side]); scene.add(m); slabs.push([m, i, (i % 2 ? 1 : -1) * (0.06 + 0.04 * i)]); });
      const timerRing = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.035, 10, 64), new THREE.MeshBasicMaterial({ color: 0xff3b3b })); scene.add(timerRing);
      const timer = panel(1.9, 0.48, 160, { edge: 0xff3b3b, tint: 0x2a0b0b });
      // shot 3: crystal bookmark + zap beam + text
      const bmShape = new THREE.Shape(); bmShape.moveTo(-0.5, 0.75); bmShape.lineTo(0.5, 0.75); bmShape.lineTo(0.5, -0.75); bmShape.lineTo(0, -0.38); bmShape.lineTo(-0.5, -0.75); bmShape.lineTo(-0.5, 0.75);
      const bookmark = new THREE.Mesh(new THREE.ExtrudeGeometry(bmShape, { depth: 0.22, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 3 }),
        new THREE.MeshPhysicalMaterial({ color: 0x7ff3ff, roughness: 0.05, metalness: 0.1, transmission: 0.6, thickness: 0.4, ior: 1.6, clearcoat: 1, emissive: 0x00a8c0, emissiveIntensity: 0.5, iridescence: 0.8 }));
      bookmark.geometry.center(); scene.add(bookmark);
      const bmGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, color: 0x00e5ff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); scene.add(bmGlow);
      const zap = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1, 8), new THREE.MeshBasicMaterial({ color: 0x9ffcff })); scene.add(zap);
      const saveP = panel(2.8, 1.25, 420, { tint: 0x081420 });
      // shot 4: two tilted glass consoles + emerald orb + beam
      const conTop = panel(3.0, 1.15, 420); const conBot = panel(3.0, 1.55, 520, { edge: 0x7a9cff });
      const orb = new THREE.Mesh(new THREE.IcosahedronGeometry(0.28, 3), new THREE.MeshPhysicalMaterial({ color: 0x2bff9a, emissive: 0x18d97a, emissiveIntensity: 1.2, roughness: 0.15, clearcoat: 1 })); scene.add(orb);
      const orbGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, color: 0x2bff9a, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); scene.add(orbGlow);
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1, 8), new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true })); scene.add(beam);
      // shot 5: three neon badges
      const badges = ["No browsing", "No README files", "Right skill, every time"].map((s) => { const p = panel(2.6, 0.46, 150, { tint: 0x06202a });
        const g = p.ct.g, w = p.ct.c.width, h = p.ct.c.height; g.clearRect(0, 0, w, h); g.textBaseline = "middle"; txt(g, "✦", 30, h / 2 + 4, 70, "#00E5FF");
        let fs = 70; g.font = `900 ${fs}px Montserrat`; while (g.measureText(s).width > w - 160 && fs > 40) { fs -= 2; g.font = `900 ${fs}px Montserrat`; } txt(g, s, 120, h / 2 + 4, fs, "#e9feff"); p.ct.tx.needsUpdate = true; return p; });
      // shot 6: CTA card
      const cta = panel(3.0, 1.5, 480);
      { const g = cta.ct.g, w = cta.ct.c.width, h = cta.ct.c.height; g.textAlign = "center"; g.textBaseline = "middle"; txt(g, "Comment", w / 2, h * 0.24, 110, "#ffffff"); txt(g, '"SKILL" 👇', w / 2, h * 0.5, 120, "#00E5FF");
        g.fillStyle = "#00E5FF"; const bw = 640, bh = 96; g.beginPath(); g.roundRect(w / 2 - bw / 2, h * 0.78 - bh / 2, bw, bh, 48); g.fill(); txt(g, "Follow @Shichi.AI", w / 2, h * 0.78 + 4, 58, "#04121c", 800); cta.ct.tx.needsUpdate = true; }

      /* ---------- per-frame drawing of the live panels ---------- */
      function drawHook(t) {
        const p = hook, g = p.ct.g, w = p.ct.c.width, h = p.ct.c.height; g.clearRect(0, 0, w, h);
        [["#ff5f57", 30], ["#febc2e", 62], ["#28c840", 94]].forEach(([c, x]) => { g.fillStyle = c; g.beginPath(); g.arc(x, 34, 11, 0, 7); g.fill(); });
        txt(g, "claude-skills — zsh", 124, 44, 26, "#7fa8c0", 700, "JetBrains Mono");

        if (t >= C.h4) { g.globalAlpha = seg(t, C.h4, C.h4 + 0.25); txt(g, "one command → the exact skill", w / 2, 540, 40, "#9fe9f5", 800, "JetBrains Mono"); g.globalAlpha = 1; }
        g.textAlign = "left"; p.ct.tx.needsUpdate = true;
      }
      function drawSave(t) {
        const p = saveP, g = p.ct.g, w = p.ct.c.width, h = p.ct.c.height; g.clearRect(0, 0, w, h); g.textAlign = "center"; g.textBaseline = "middle";
        [["Save this", "#ffffff", C.save, 96, 0.26], ["before you forget", "#00E5FF", C.forget - 0.25, 78, 0.52], ["Find Skills", "#ffffff", C.name, 120, 0.82]].forEach(([s, col, t0, sz, y]) => {
          if (t < t0) return; const k = backOut((t - t0) / 0.28); g.save(); g.translate(w / 2, h * y); g.scale(1.4 - 0.4 * k, 1.4 - 0.4 * k); txt(g, s, 0, 0, sz, col); g.restore(); });
        g.textAlign = "left"; p.ct.tx.needsUpdate = true;
      }
      function drawConsoles(t) {
        { const g = conTop.ct.g, w = conTop.ct.c.width, h = conTop.ct.c.height; g.clearRect(0, 0, w, h); g.textBaseline = "alphabetic"; txt(g, "zsh", 30, 50, 30, "#7fa8c0", 700, "JetBrains Mono");
          const cmd = "npx skills add vercel-labs/skills", n = Math.floor(clamp((t - C.cmd0) / (C.cmd1 - C.cmd0), 0, 1) * cmd.length);
          txt(g, "$", 30, 170, 52, "#28c840", 800, "JetBrains Mono"); txt(g, cmd.slice(0, n) + (t < C.cmd1 + 0.1 && t % 0.4 < 0.2 ? "▍" : ""), 80, 170, 52, "#e8f6ff", 800, "JetBrains Mono");
          if (t >= C.cmd1 + 0.1) txt(g, "✓ Installed find-skills", 30, 290, 54, "#5dffa8", 800, "JetBrains Mono"); conTop.ct.tx.needsUpdate = true; }
        { const g = conBot.ct.g, w = conBot.ct.c.width, h = conBot.ct.c.height; g.clearRect(0, 0, w, h); g.textBaseline = "alphabetic"; txt(g, "✳ Claude Code", 30, 52, 32, "#b9c8ff", 800, "JetBrains Mono");
          g.strokeStyle = "#7a9cff"; g.lineWidth = 3; g.beginPath(); g.roundRect(w - 260, 18, 230, 52, 26); g.stroke(); txt(g, "Sonnet 4.6", w - 238, 54, 28, "#b9c8ff", 800, "JetBrains Mono");
          const q = "Is there a skill for 3D video?", n = Math.floor(clamp((t - C.ask0) / (C.ask1 - C.ask0), 0, 1) * q.length);
          txt(g, ">", 30, 160, 50, "#00E5FF", 800, "JetBrains Mono"); txt(g, q.slice(0, n) + (t < C.ask1 && t >= C.ask0 - 0.3 && t % 0.4 < 0.2 ? "▍" : ""), 76, 160, 50, "#ffffff", 800, "JetBrains Mono");

          conBot.ct.tx.needsUpdate = true; }
      }

      /* ---------- camera direction ---------- */
      function camAt(t, shot) {
        if (shot === "hook") { const k = expoOut(t / 2.4); return [[lerp(0.2, 0.1, k), lerp(1.3, 1.2, k), lerp(20, 9.6, k)], [0, 1.1, 0]]; }
        if (shot === "github") { const u = (t - SH[1]) / (SH[2] - SH[1]), a = lerp(-0.35, 0.4, smooth(u)); return [[Math.sin(a) * 11.5, lerp(2.2, 2.9, u), Math.cos(a) * 11.5], [0, 2.45, 0]]; }
        if (shot === "save") { const u = (t - SH[2]) / (SH[3] - SH[2]); return [[lerp(0.5, 0.15, u), lerp(1.4, 1.2, u), lerp(9.8, 9.0, u)], [0, 1.15, 0]]; }
        if (shot === "demo") { const u = (t - SH[3]) / (SH[4] - SH[3]); return [[lerp(-0.7, 0.6, u), lerp(1.4, 1.2, u), lerp(9.6, 9.0, u)], [0, 1.2, 0]]; }
        if (shot === "checks") { const u = (t - SH[4]) / (SH[5] - SH[4]); return [[lerp(0.9, -0.6, u), 1.3, 9.0], [0, 1.2, 0]]; }
        const u = (t - SH[5]) / (C.loop - SH[5]); return [[lerp(0.5, 0.1, u), 1.3, lerp(9.4, 8.8, u)], [0, 1.25, 0]];
      }

      function renderAt(t) {

        if (looping) { const k = seg(t, C.loop, DUR); pos = lerp3([0.1, 1.3, 8.8], [0.2, 1.3, 20], k); tgt = [0, lerp(1.25, 1.1, k), 0]; }   // whip-dolly through a ring back to the opening pose
