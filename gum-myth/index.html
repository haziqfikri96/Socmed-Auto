      const rim = new THREE.DirectionalLight(0x9fe8ff, 1.3); rim.position.set(-5, 3, -4); scene.add(rim);

      const backdrop = (pos, stops, R0 = 40) => { const tx = canvasTex(64, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); stops.forEach(([o, c]) => gr.addColorStop(o, c)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
          const R = rng(5); for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${0.06 + R() * 0.16})`; g.beginPath(); g.arc(R() * w, R() * h, 1 + R() * 5, 0, 7); g.fill(); } });

      /* ---------- the gum: a lumpy chewed blob, studded with sugar, sweetener and mint ---------- */
      function makeGumMesh(r) {
        const g = mergeVertices(new THREE.IcosahedronGeometry(r, 5)), p = g.attributes.position, v = new THREE.Vector3();

      }
      const gumMat = new THREE.MeshPhysicalMaterial({ color: 0xff4f9e, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.12, sheen: 0.6, sheenColor: new THREE.Color(0xffc2e2), emissive: 0x5a0a30, emissiveIntensity: 0.25 });

      const R4 = rng(77), bits = [];   // [mesh, group 0 sugar / 1 sweetener / 2 mint, rest position, flight dir, spin, delay]
      const fib = (i, n) => { const y = 1 - (i + 0.5) / n * 2, rr = Math.sqrt(1 - y * y), th = i * 2.39996; return new THREE.Vector3(Math.cos(th) * rr, y, Math.sin(th) * rr); };
      for (let i = 0; i < 18; i++) {
        const grpI = i % 3, geo = grpI === 0 ? new RoundedBoxGeometry(0.15, 0.15, 0.15, 2, 0.03) : grpI === 1 ? new THREE.SphereGeometry(0.06, 14, 10) : new THREE.OctahedronGeometry(0.1, 0);
        const m = new THREE.Mesh(geo, grpI === 0 ? cubeMat : grpI === 1 ? sweetMat : mintMat);
        const n = fib(i, 18), rest = n.clone().multiplyScalar(0.43);
        m.position.copy(rest); m.rotation.set(R4() * 6, R4() * 6, R4() * 6); if (grpI === 2) m.scale.set(0.8, 1.5, 0.8);
        gumA.add(m); bits.push([m, grpI, rest, n.clone().add(new THREE.Vector3(0, 0.9, 0)).normalize(), R4() * 4 - 2, R4() * 0.25]);
      }
      const fizz = []; { const RF = rng(91); for (let i = 0; i < 70; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.025 + RF() * 0.03, 10, 8), new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.05, clearcoat: 1, transparent: true, opacity: 0 }));
        fizz.push([s, i % 18, RF(), RF() * 6.28, 0.5 + RF()]); } }

      /* ---------- set 1: esophagus + stomach cutaway with an emerald acid pool ---------- */
      const body1 = new THREE.Group(); scene.add(body1);
      const bg1 = backdrop(new THREE.Vector3(0, 2, 0), [[0, "#ffe1ec"], [0.45, "#ffb3cf"], [1, "#8f6cff"]]);
      const SRX = 2.0, SRY = 1.9, SRZ = 1.7, ACID = -0.55, ESO_R = 0.56, ESO_Y0 = 1.72, ESO_Y1 = 9;
      const rugae = canvasTex(512, 512, (g, w, h) => { g.fillStyle = "#ff9db5"; g.fillRect(0, 0, w, h); const R = rng(3); g.lineCap = "round";
        for (let i = 0; i < 34; i++) { const x0 = R() * w; g.strokeStyle = `rgba(${R() < 0.5 ? "214,70,110" : "255,214,226"},${0.35 + R() * 0.3})`; g.lineWidth = 6 + R() * 10; g.beginPath(); g.moveTo(x0, 0);
          for (let y = 0; y <= h; y += 32) g.lineTo(x0 + Math.sin(y * 0.03 + i) * 18, y); g.stroke(); } });
      const stomach = new THREE.Mesh(new THREE.SphereGeometry(1, 72, 56, Math.PI, Math.PI, 0.3, Math.PI - 0.3),
        new THREE.MeshPhysicalMaterial({ map: rugae, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.18, side: THREE.DoubleSide, sheen: 0.4, sheenColor: new THREE.Color(0xffd6e4) }));
      stomach.scale.set(SRX, SRY, SRZ); body1.add(stomach);
      const rimMat = new THREE.MeshPhysicalMaterial({ color: 0xff5f86, roughness: 0.25, clearcoat: 1 });
      { const pts = []; for (let i = 0; i <= 80; i++) { const a = Math.PI / 2 + 0.31 + (2 * Math.PI - 0.62) * i / 80; pts.push(new THREE.Vector3(Math.cos(a) * SRX, Math.sin(a) * SRY, 0)); }

      const esoBase = esoGeo.attributes.position.array.slice();
      const esoMat = new THREE.MeshPhysicalMaterial({ color: 0xff7a6b, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.12, side: THREE.DoubleSide, sheen: 0.5, sheenColor: new THREE.Color(0xffc9b8) });
      const eso = new THREE.Mesh(esoGeo, esoMat); eso.position.y = (ESO_Y0 + ESO_Y1) / 2; body1.add(eso);
      function shapeEso(gy) { const p = esoGeo.attributes.position, half = (ESO_Y1 - ESO_Y0) / 2;
        for (let i = 0; i < p.count; i++) { const x = esoBase[i * 3], y = esoBase[i * 3 + 1], z = esoBase[i * 3 + 2], wy = y + half + ESO_Y0;
          const r = ESO_R * (1 + 0.07 * Math.sin(wy * 13)) + 0.2 * Math.exp(-((wy - gy) ** 2) / 0.35); p.setXYZ(i, x * r, y, z * r); }
        p.needsUpdate = true; esoGeo.computeVertexNormals(); }
      for (const sx of [-1, 1]) { const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, ESO_Y1 - ESO_Y0, 12), rimMat); rod.position.set(sx * ESO_R, (ESO_Y0 + ESO_Y1) / 2, 0); body1.add(rod); }

      const surf = new THREE.Mesh(surfGeo, acidMat); surf.rotation.x = -Math.PI / 2; surf.scale.set(SRX * surfR * 0.985, SRZ * surfR * 0.985, 1); surf.position.y = ACID; body1.add(surf);

      for (let i = 0; i < 46; i++) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.04 + R5() * 0.06, 14, 10), new THREE.MeshPhysicalMaterial({ color: 0xc8ffe6, roughness: 0.04, clearcoat: 1, transparent: true, opacity: 0.85, emissive: 0x30ff9a, emissiveIntensity: 0.35 }));
        body1.add(b); acidBubbles.push([b, (R5() - 0.5) * 2.6, R5(), 0.35 + R5() * 0.5, -0.05 - R5() * 0.6]); }
      const drops = []; for (let i = 0; i < 30; i++) { const d = new THREE.Mesh(new THREE.SphereGeometry(0.05 + R5() * 0.05, 14, 10), acidMat); d.visible = false; body1.add(d); drops.push([d, (R5() - 0.5) * 2.2, 2.2 + R5() * 2.4, (R5() - 0.2) * 0.9]); }

      body1.add(gumA); fizz.forEach(([s]) => body1.add(s));
