        bang: `<svg viewBox="0 0 100 100"><polygon points="38,6 64,6 58,64 44,64" fill="#ef4444" stroke="#fff" stroke-width="5"/><polygon points="51,6 64,6 58,64 51,64" fill="#b91c1c"/><polygon points="51,72 61,78 61,90 51,96 41,90 41,78" fill="#ef4444" stroke="#fff" stroke-width="5"/></svg>`,
        question: `<svg viewBox="0 0 100 100"><path d="M28 34 Q28 8 52 8 Q76 8 76 30 Q76 44 60 52 Q54 56 54 66 L42 66 Q42 50 54 43 Q63 38 63 30 Q63 20 52 20 Q41 20 41 34 Z" fill="#facc15" stroke="#3b2a05" stroke-width="5" stroke-linejoin="round"/><polygon points="48,74 58,79 58,90 48,95 38,90 38,79" fill="#facc15" stroke="#3b2a05" stroke-width="5"/></svg>`,
        sparkle: `<svg viewBox="0 0 100 100"><polygon points="50,4 58,42 96,50 58,58 50,96 42,58 4,50 42,42" fill="#fde047" stroke="#7c5a00" stroke-width="3"/><polygon points="50,4 58,42 96,50 50,50" fill="#fff7c2"/><polygon points="82,10 85,22 97,25 85,28 82,40 79,28 67,25 79,22" fill="#fff"/><polygon points="20,66 23,76 33,79 23,82 20,92 17,82 7,79 17,76" fill="#fde047"/></svg>`,
        sweat: `<svg viewBox="0 0 100 100"><path d="M40 10 Q62 40 62 58 Q62 76 44 76 Q26 76 26 58 Q26 40 40 10 Z" fill="#7dd3fc" stroke="#0c4a6e" stroke-width="4"/><path d="M34 52 Q34 44 38 38" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M74 40 Q86 56 86 66 Q86 76 77 76 Q68 76 68 66 Q68 56 74 40 Z" fill="#7dd3fc" stroke="#0c4a6e" stroke-width="3"/></svg>`,
        anger: `<svg viewBox="0 0 100 100"><g fill="none" stroke="#ef4444" stroke-width="11" stroke-linecap="round"><path d="M40 12 Q40 40 12 40"/><path d="M60 12 Q60 40 88 40"/><path d="M40 88 Q40 60 12 60"/><path d="M60 88 Q60 60 88 60"/></g></svg>`,
        zzz: `<svg viewBox="0 0 100 100"><g fill="#c7d2fe" stroke="#312e81" stroke-width="3" stroke-linejoin="round"><polygon points="10,52 44,52 44,60 24,80 44,80 44,88 10,88 10,80 30,60 10,60"/><polygon points="54,22 80,22 80,28 64,44 80,44 80,50 54,50 54,44 70,28 54,28"/></g></svg>`,
      };
      const emoteEls = D.emotes.map(([, , , kind]) => { const d = document.createElement("div"); d.className = "emote"; d.innerHTML = SVG[kind]; $("hud").appendChild(d); return d; });

      /* ---------------- cards: semi-transparent, back.out(1.7) spring in, slow micro-zoom while up ---------------- */
      const CODE = '<span class="k">&lt;div</span> <span class="t">class</span>=<span class="s">"title"</span><span class="k">&gt;</span>\n  Hello!\n<span class="k">&lt;/div&gt;</span>\n<span class="k">&lt;script&gt;</span>\n  <span class="t">gsap</span>.from(<span class="s">".title"</span>,\n    { y: 200 })\n<span class="k">&lt;/script&gt;</span>';
      function typeHTML(html, n) {
        let out = "", shown = 0, i = 0;
        while (i < html.length && shown < n) {
          if (html[i] === "<") { const j = html.indexOf(">", i); out += html.slice(i, j + 1); i = j + 1; continue; }
          if (html[i] === "&") { const j = html.indexOf(";", i); out += html.slice(i, j + 1); i = j + 1; shown++; continue; }
          out += html[i++]; shown++;
        }
        const open = (out.match(/<span[^>]*>/g) || []).length - (out.match(/<\/span>/g) || []).length;
        return out + "</span>".repeat(Math.max(0, open));
      }
      const fmt = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(Math.round(n)));
      const wordAt = (i, prefix) => LINES[i].words.find((w) => w.w.toLowerCase().replace(/[^a-z0-9]/g, "").startsWith(prefix)).s;

      /* the desk monitor: desktop with the mystery file, then code while Quill explains */
      const mx = monC.getContext("2d");
      function monitorAt(t) {
        const W = 512, H = 312;
        if (t < LINES[3].s) {
          const g = mx.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#3b2a7a"); g.addColorStop(1, "#c2507a"); mx.fillStyle = g; mx.fillRect(0, 0, W, H);
          mx.fillStyle = "rgba(0,0,0,0.35)"; mx.fillRect(0, 0, W, 22);
          [["notes.txt", 40, 50], ["memes", 40, 140]].forEach(([n, x, y]) => { mx.fillStyle = "#e2e8f0"; mx.fillRect(x, y, 46, 56); mx.fillStyle = "#fff"; mx.font = "bold 16px sans-serif"; mx.fillText(n, x - 6, y + 78); });
          const glow = 0.5 + 0.5 * Math.sin(t * 6);
          mx.fillStyle = `rgba(250,204,21,${0.35 + 0.35 * glow})`; mx.fillRect(250, 80, 190, 150);
          mx.fillStyle = "#111827"; mx.fillRect(300, 95, 90, 70); mx.fillStyle = "#f97316"; mx.beginPath(); mx.moveTo(335, 115); mx.lineTo(335, 145); mx.lineTo(360, 130); mx.fill();
          mx.fillStyle = "#fff"; mx.font = "bold 20px sans-serif"; mx.fillText("hyperframes", 280, 200);
        } else {
          mx.fillStyle = "#0b1020"; mx.fillRect(0, 0, W, H);
          const cols = ["#c084fc", "#60a5fa", "#4ade80", "#f472b6", "#e2e8f0"];
          const scroll = Math.floor((t - LINES[3].s) * 3);
          for (let r = 0; r < 12; r++) {
            const n = (r + scroll) * 7919 % 97;
            mx.fillStyle = cols[n % 5]; mx.fillRect(20 + (n % 3) * 24, 18 + r * 24, 80 + (n * 37) % 300, 10);
          }
        }
        monT.needsUpdate = true;
      }

      function hud(t) {
        let blur = 0;
        for (const [id, a, b] of D.cards) {
          const v = t >= a && t < b, el = $(id);
          el.style.opacity = v ? seg(t, a, a + 0.12) * (1 - seg(t, b - 0.15, b)) : 0;
          el.style.transform = v ? `scale(${((0.86 + 0.14 * springIn(t, a, 0.45)) * (1 + 0.025 * clamp((t - a) / Math.max(0.5, b - a), 0, 1))).toFixed(4)})` : "";
          if (v) blur = Math.max(blur, seg(t, a, a + 0.15) * (1 - seg(t, b - 0.15, b)));
        }
        $("dim").style.opacity = (0.35 * blur).toFixed(3);   // flat dim, no per-frame blur filter
        const cur = Math.floor(t * 3) % 2 ? '<span class="cur">&nbsp;</span>' : " ";

        // step 0: requirements pop on their words
        [D.nodeAt, D.ffAt].forEach((a, i) => { $("rq" + i).style.opacity = t >= a ? 1 : 0; $("rq" + i).style.transform = `translateX(${((1 - springIn(t, a, 0.35)) * 60).toFixed(1)}px)`; });

        // step 1: the two install commands type out as Quill says them
        const C1 = "claude plugin marketplace add heygen-com/hyperframes", C2 = "claude plugin install hyperframes@hyperframes";
        const n1 = Math.floor(clamp((t - D.T1) / 1.1, 0, 1) * C1.length), n2 = Math.floor(clamp((t - D.T2) / 0.85, 0, 1) * C2.length);
        const wrap = (c, n, at) => (n > at ? c.slice(0, at) + "\n  " + c.slice(at + 1, n) : c.slice(0, n));
        let term = `<span class="h"># in Claude Code</span>\n<span class="p">$</span> ${wrap(C1, n1, 29)}`;
        if (t >= D.T2) term += `\n<span class="p">$</span> ${wrap(C2, n2, 21)}`;
        if (t >= D.T2 + 1.0) term += `\n<span class="ok">✓ Installed hyperframes</span>`;
        $("instBody").innerHTML = term + cur;

        // step 2: the prompt types into the chat, then Claude answers
        const a0 = D.cards[3][1], P = "Using /hyperframes, make a 10-second intro with a fade-in title";
        const np = Math.floor(clamp((t - a0 - 0.1) / 1.9, 0, 1) * P.length);
        $("askText").innerHTML = P.slice(0, np).replace("/hyperframes", '<span class="sl">/hyperframes</span>') + (np < P.length ? cur : "");
        const aiOn = t >= a0 + 2.3;
        $("askAI").style.opacity = aiOn ? 1 : 0; $("askAI").style.transform = `scale(${springIn(t, a0 + 2.3, 0.35).toFixed(3)})`;
        const steps = ["✍️ writing index.html", "✓ checked: 0 errors", "✓ ready to preview"];
        $("askAIText").innerHTML = steps.filter((_, k) => t >= a0 + 2.3 + k * 0.6).join("<br />");

        // step 3: preview, then render
        let run = `<span class="p">$</span> npx hyperframes preview`;
        if (t >= D.previewAt + 0.4) run += `\n<span class="ok">✓ live at localhost:3002</span>`;
        if (t >= D.renderAt) run += `\n<span class="p">$</span> npx hyperframes render`;
        if (t >= D.renderAt + 0.6) run += `\n<span class="ok">✓ my-video.mp4</span>`;
        $("runBody").innerHTML = run + cur;
        const m0 = D.previewAt + 0.4, mu = t < m0 ? 0 : smooth((((t - m0) % 1.4) + 1.4) % 1.4 / 0.7);
        $("mini2").style.opacity = t >= m0 ? 1 : 0; $("mini2").style.transform = `scale(${springIn(t, m0, 0.35).toFixed(3)})`;
        $("mini2T").style.opacity = mu; $("mini2T").style.transform = `translateY(${(30 * (1 - mu)).toFixed(1)}px)`;

        // CTA tags on "free" and "open source"
        [D.freeAt, D.openAt, D.openAt + 0.5].forEach((a, i) => { $("tg" + i).style.opacity = t >= a ? 1 : 0; $("tg" + i).style.transform = `scale(${springIn(t, a, 0.3)})`; });

        // subtitles + speaker badge (inside the safe zone)
        const i = lineAt(t), L = LINES[i], on = t >= L.s - 0.05 && t < L.e + 0.2;
        $("sub").style.opacity = on ? 1 : 0;
        $("who").textContent = L.who === "dev" ? "SHICHI" : "QUILL"; $("who").className = L.who;
        $("line").textContent = L.text;
      }

      function renderAt(t) {
        monitorAt(t);
        const shotNow = D.shots[beatAt(D.shots, t)][1];
        // Shichi: pose + expression eased between beats
        const di = beatAt(D.dev, t), [d0, dExpr, dPose] = D.dev[di], [, pExpr, pPose] = D.dev[Math.max(0, di - 1)];
        const dk = di === 0 ? 1 : seg(t, d0, d0 + 0.25);
        const pose = dev.blend(pPose, dPose, dk);
        const qTalking = LINES[lineAt(t)].who === "quill";
        pose.head = [(pose.head?.[0] || 0) + 0.02 * Math.sin(t * 1.3), (pose.head?.[1] || 0) + (qTalking ? 0.32 : 0) + 0.04 * Math.sin(t * 1.1), (pose.head?.[2] || 0) + 0.03 * Math.sin(t * 1.7)];
        if (dPose === "angry") pose.body = [0.12, 0, 0.03 * Math.sin(t * 30) * (t < S(18) + 0.6 ? 1 : 0)];
        dev.pose(pose);
        const hop = dExpr === "shock" || dExpr === "horror" ? 0.025 * Math.max(0, Math.sin(Math.min(1, (t - d0) / 0.25) * Math.PI)) : 0;
        const sleeping = t >= SLP0 && t < SLP1, facingMonitor = shotNow.startsWith("hook");
        dev.group.position.set(-0.32, 0.004 * Math.sin(t * 2.4) + hop, sleeping ? -0.02 : 0);
        dev.group.rotation.y = sleeping ? Math.PI : facingMonitor ? Math.PI + 0.15 : 0.35;
        quill.group.visible = !sleeping && !facingMonitor; monBox.visible = monStand.visible = mon.visible = !facingMonitor;   // the camera is the monitor here
        // monitor-POV hook: warm key from the camera side, dim cyan rim, so his face keeps its skin tone
        if (facingMonitor) { key.position.set(-1.0, 2.2, -2.6); rim.intensity = 0.35; screenLight.intensity = 0.6; }
        else { key.position.set(1.4, 2.6, 2.4); rim.intensity = 1.5; screenLight.intensity = 1.2; } mug.visible = !sleeping;
        dev.face({ expr: pExpr, to: dExpr, k: dk, talk: mouthOf("dev", t), blink: dExpr === "asleep" ? 1 : blinkOf(BLINK_DEV, t), t });

        // Quill: mood + gesture, idle bob and blinks all the time (also behind the cards)
        const qi = beatAt(D.quill, t), [q0, qMood, qGest] = D.quill[qi];
        quill.face({ mood: qMood, talk: mouthOf("quill", t), blink: blinkOf(BLINK_Q, t), t });
        quill.update(t, qGest, seg(t, q0, q0 + 0.3));
        quill.group.position.set(0.34 + (qMood === "wince" ? 0.06 * seg(t, q0, q0 + 0.12) : 0), 0.2 + 0.012 * Math.sin(t * 1.9), 0.05);
        quill.group.rotation.y = -0.45 + (qTalking ? 0 : -0.15);

        const [cp, cl] = camAt(t);
        camera.position.set(...cp); camera.lookAt(...cl);
        renderer.render(scene, camera);
        hud(t);

        // emotes ride above the heads, springing in with back.out(1.7)
        D.emotes.forEach(([a, b, who], n) => {
          const el = emoteEls[n], on = t >= a && t < b;
          el.style.opacity = on ? 1 - seg(t, b - 0.12, b) : 0;
          if (!on) return;
          const anchor = who === "dev" ? dev.rig.head.localToWorld(new THREE.Vector3(0.17, 0.42, 0)) : quill.group.localToWorld(new THREE.Vector3(-0.22, 0.72, 0));
          const v = anchor.project(camera);
          let x = clamp((v.x + 1) / 2 * 1080, 140, 900), y = clamp((1 - v.y) / 2 * 1920, 260, 1300);
          if (D.emotes[n][3] === "sparkle") {
            const pop = D.cards.map((c) => c[0]).map($).find((e) => +e.style.opacity > 0.5);
            if (pop) { const r = pop.getBoundingClientRect(); x = Math.min(r.right - 60, 880); y = Math.max(r.top + 60, 300); }
            else { x = Math.max(x, 300); y = Math.max(y, 320); }   // never near the @shichi.ai mark
          }
          el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${springIn(t, a, 0.3).toFixed(3)}) rotate(${(8 * Math.sin(t * 6)).toFixed(1)}deg)`;
        });
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      const root = window.__timelines["tutorial-hyperframes"];
      root.eventCallback("onUpdate", () => renderAt(root.time()));
      renderAt(window.__hfThreeTime || root.time() || 0);
    </script>
