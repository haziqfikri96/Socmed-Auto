<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #E8E8E8;
        --ink: #0F0F0F;
        --accent: #2563EB;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        background: var(--bg);
        font-family: 'Montserrat', Arial, sans-serif;
      }

      /* Accent bar behind "YOUR" */
      #accent-bar {
        position: absolute;
        left: 0; right: 0;
        height: 260px;
        top: 700px;
        background: var(--accent);
        transform-origin: center center;
      }

      /* Side accent stripe */
      #side-line {
        position: absolute;
        left: 64px;
        top: 680px;
        width: 14px;
        height: 560px;
        background: var(--accent);
        transform-origin: top center;
      }

      /* accent word — white on the blue bar */
      #accent-word {
        position: absolute;
        top: 710px;
        width: 100%;
        text-align: center;
        font-size: 240px;
        font-weight: 900;
        letter-spacing: -0.04em;
        color: #fff;
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
      }

      #noun-line1 {
        position: absolute;
        top: 980px;
        width: 100%;
        text-align: center;
        font-size: 150px;
        font-weight: 900;
        letter-spacing: -0.04em;
        color: var(--ink);
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
      }

      #noun-line2 {
        position: absolute;
        top: 1140px;
        width: 100%;
        text-align: center;
        font-size: 150px;
        font-weight: 900;
        letter-spacing: -0.04em;
        color: var(--ink);
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
      }

      #sub-label {
        position: absolute;
        top: 1340px;
        width: 100%;
        text-align: center;
        font-size: 46px;
        font-weight: 900;
        letter-spacing: 0.1em;
        color: var(--ink);
        text-transform: uppercase;
        font-family: 'Montserrat', Arial, sans-serif;
      }

      #bottom-bar {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 10px;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="hook"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <div id="accent-bar" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
      <div id="side-line"  class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
      <div id="accent-word" class="clip" data-start="0" data-duration="3" data-track-index="1" data-layout-allow-overlap>YOUR</div>
      <div id="noun-line1"  class="clip" data-start="0" data-duration="3" data-track-index="2">JOB IS</div>
      <div id="noun-line2"  class="clip" data-start="0" data-duration="3" data-track-index="2">CHANGING</div>
      <div id="sub-label"   class="clip" data-start="0" data-duration="3" data-track-index="3">AND NOBODY TOLD YOU</div>
      <div id="bottom-bar"  class="clip" data-start="0" data-duration="3" data-track-index="0"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* accent bar: scale in from center */
      tl.fromTo("#accent-bar",
        { scaleX: 0, transformOrigin: "center center" },
        { scaleX: 1, duration: 0.2, ease: "power4.out" },
        0
      );

      /* side line grows down */
      tl.fromTo("#side-line",
        { scaleY: 0, transformOrigin: "top center" },
        { scaleY: 1, duration: 0.3, ease: "power3.out" },
        0.05
      );

      /* accent word slams down from above */
      tl.fromTo("#accent-word",
        { y: -300, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.25, ease: "back.out(1.3)" },
        0.08
      );

      /* noun line 1 slams up from below */
      tl.fromTo("#noun-line1",
        { y: 200, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.22, ease: "back.out(1.2)" },
        0.26
      );

      /* noun line 2 slams up, staggered */
      tl.fromTo("#noun-line2",
        { y: 200, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.22, ease: "back.out(1.2)" },
        0.38
      );

      /* sub label fades + slides up */
      tl.fromTo("#sub-label",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" },
        0.52
      );

      /* bottom bar scales in */
      tl.fromTo("#bottom-bar",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.3, ease: "power3.out" },
        0.55
      );

      /* punch: accent word subtle scale pop at 0.8s */
      tl.to("#accent-word",
        { scale: 1.05, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1 },
        0.82
      );

      /* exit at 2.5s — wipe everything up */
      tl.to(["#noun-line1", "#noun-line2", "#sub-label"],
        { y: -80, opacity: 0, stagger: 0.05, duration: 0.18, ease: "power3.in" },
        2.4
      );
      tl.to("#accent-word",
        { y: -120, opacity: 0, duration: 0.18, ease: "power3.in" },
        2.42
      );
      tl.to(["#accent-bar", "#side-line"],
        { scaleX: 0, transformOrigin: "center center", duration: 0.15, ease: "power4.in" },
        2.52
      );

      window.__timelines["hook"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
