        const s = srcTime(t); renderScene(s);
        const whip = Math.max(...SH.slice(1).map((a) => bell(t, a - 0.06, a + 0.22)), bell(t, BC.loop, BD + 0.02));
        if (t >= BC.loop) { camera.position.x += 1.4 * (1 - seg(t, BC.loop, BD - 0.02)); camera.updateMatrixWorld(); }
        const w0 = t < BC.eyeWipe ? SH[1] + 0.15 : BC.eyeWipe + 0.15, k = t >= SH[1] && t < SH[2] ? clamp((t - w0) / 1.3, 0, 1) : 1;
        const wl = $("wipe");
        if (k < 1) {
          const [pl, a1, a2] = wipePlane(k);
          if (k > 0) { renderer.clippingPlanes = [pl]; composer.render(); renderer.clippingPlanes = []; } else { renderer.setRenderTarget(null); renderer.setClearColor(darkBg, 1); renderer.clear(); renderer.setClearColor(0x000000, 0); }
          drawWire(k > 0 ? [pl.clone().negate()] : []);
          const cx = (a1[0] + a2[0]) / 2, cy = (a1[1] + a2[1]) / 2, ang = Math.atan2(a2[1] - a1[1], a2[0] - a1[0]);
          wl.style.opacity = k > 0 ? 1 : 0; wl.style.transform = `translate(${cx.toFixed(1)}px, ${cy.toFixed(1)}px) rotate(${ang.toFixed(4)}rad)`;
        } else { composer.render(); wl.style.opacity = 0; }
        btsHud(t, whip);
      }
      { const lv = $("lVoice"); lv.innerHTML = window.BARS.map((h, i) => `<div class="wb" id="wb${i}" style="left:${(i / window.BARS.length * 100).toFixed(2)}%;height:${Math.max(3, h * 46).toFixed(0)}px"></div>`).join("");
        const MK = [["slice", 0.07], ["gas", 0.3], ["splash", 0.53], ["click", 0.75], ["whip", 0.93]];
        $("lSfx").innerHTML = MK.map(([n, f], i) => `<div class="mk" id="mk${i}" style="left:${(f * 100).toFixed(1)}%">${n}</div>`).join("");
        $("lCam").innerHTML = [0.04, 0.22, 0.41, 0.6, 0.82].map((f, i) => `<div class="kf" id="kf${i}" style="left:${(f * 100).toFixed(1)}%"></div>`).join(""); }
      const MKF = [0.06, 0.3, 0.55, 0.78, 0.95], KFF = [0.04, 0.22, 0.41, 0.6, 0.82];
      function btsHud(t, whip) {
        const hk = $("hook"), hOn = t < SH[1] - 0.3; hk.style.opacity = hOn ? 1 - seg(t, SH[1] - 0.55, SH[1] - 0.3) : 0; hk.style.transform = `translate(-50%, -50%) scale(${(1.18 - 0.18 * expoOut(t / 0.22)).toFixed(3)})`;
        const bs = $("bShader"), bOn = t >= SH[1] + 0.2 && t < SH[2] - 0.1 ? 1 : 0; bs.style.opacity = bOn; bs.style.transform = `translateX(-50%) scale(${bOn ? (1.3 - 0.3 * expoOut((t - SH[1] - 0.2) / 0.3)).toFixed(3) : 1})`;
        const tOn = t >= SH[2] && t < SH[3] - 0.05 ? seg(t, SH[2], SH[2] + 0.25) : 0, tp = $("tlp"); tp.style.opacity = tOn; tp.style.transform = `translateY(${(30 * (1 - tOn)).toFixed(1)}px)`;
        const f = clamp((t - SH[2] - 0.1) / (SH[3] - SH[2] - 0.3), 0, 1); $("ph").style.left = (174 + f * (860 - 14 - 174 - 6)).toFixed(1) + "px";
        window.BARS.forEach((h, i) => { $("wb" + i).style.background = i / window.BARS.length <= f ? "#00E5FF" : "#3d7ab8"; });
        MKF.forEach((m, i) => $("mk" + i).classList.toggle("on", f >= m)); KFF.forEach((m, i) => $("kf" + i).classList.toggle("on", f >= m));
        const cOn = t >= BC.cta && t < SH[3] - 0.1 ? 1 : 0, ct = $("cta"); ct.style.opacity = cOn; ct.style.transform = `translate(-50%, -50%) scale(${cOn ? (1.35 - 0.35 * backOut((t - BC.cta) / 0.3, 2.4)).toFixed(3) : 1})`;
        const tm = $("term"), mOn = t >= SH[3] && t < BC.termOff ? 1 : 0; tm.style.opacity = mOn;
        if (mOn) { const cmd = "npx hyperframes render", n = Math.floor(clamp((t - SH[3]) / 0.45, 0, 1) * cmd.length);
          tm.innerHTML = '<span class="p">$</span> ' + cmd.slice(0, n) + (t - SH[3] > 0.5 ? ' → output.mp4 <span class="ok">✓</span>' : "▍"); }
        $("smear").style.opacity = clamp(whip, 0, 1).toFixed(3);
        let li = 0; while (li < LINES.length - 1 && t >= LINES[li + 1].s - 0.05) li++;
        const L = LINES[li], on = t >= L.s - 0.03 && t < L.e; $("cap").style.opacity = on ? 1 : 0;
        if (on) { const ws = L.words, chunks = [[]];
          ws.forEach((w, j) => { let cur = chunks[chunks.length - 1]; const len = cur.reduce((n, i) => n + ws[i].w.length + 1, 0);
            if (cur.length && len + w.w.length > 20) { chunks.push([]); cur = chunks[chunks.length - 1]; }
            cur.push(j); if (/[.,!?:]$/.test(w.w) || cur.length >= 3) chunks.push([]); });
          let act = ws.findIndex((w) => t < w.e); if (act < 0) act = ws.length - 1;
          const ch = chunks.find((c) => c.includes(act)) || chunks[0], show = (w) => w.replace(/^ONION/, '"ONION"');
          $("cap").innerHTML = '<span class="ch">' + ch.map((j) => `<span class="${j === act && t >= ws[j].s ? "on" : ""}">${show(ws[j].w)}</span>`).join(" ") + "</span>"; }
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));

      const root = window.__timelines["onion-bts"];
      root.eventCallback("onUpdate", () => renderAt(root.time()));
      renderAt(window.__hfThreeTime || root.time() || 0);
    </script>
