<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Host Character Preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1626; color: #e2e8f0; font: 600 15px system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
      #ui button { padding: 10px 16px; border-radius: 999px; border: 1px solid #334155; background: #111a2e; color: #e2e8f0; font: inherit; cursor: pointer; }
      #ui button.on { background: #2563eb; border-color: #93c5fd; }
      #info { position: fixed; left: 16px; top: 16px; right: 16px; color: #94a3b8; }
    </style>
    <script type="importmap">
      { "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
      } }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="info">Loading…</div>
    <div id="ui"></div>
    <script type="module">
      // Live preview of the host character: requestAnimationFrame + THREE.Clock, 0.4 s cross-fades between states.
      // Keys 1–4 or the buttons switch state. Serve this folder over HTTP (e.g. python3 -m http.server) and open preview.html.
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { loadCharacter, SHICHI_PAINT } from "./character.js";

      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(2, devicePixelRatio));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0e1626);
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.8;
      const key = new THREE.DirectionalLight(0xffffff, 1.9);
      key.position.set(1.6, 3, 3.2); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
      key.shadow.bias = -0.0004; key.shadow.normalBias = 0.015;
      Object.assign(key.shadow.camera, { left: -0.9, right: 0.9, top: 0.9, bottom: -0.9, near: 0.1, far: 8 });
      const rim = new THREE.DirectionalLight(0x93c5fd, 1.3); rim.position.set(-2.5, 1, -2);
      scene.add(key, rim, new THREE.AmbientLight(0xffffff, 0.22));
      const floor = new THREE.Mesh(new THREE.CircleGeometry(0.8, 64), new THREE.ShadowMaterial({ opacity: 0.38 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

      const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
      camera.position.set(0.9, 0.75, 3.2);
      const controls = new OrbitControls(camera, canvas);
      controls.target.set(0, 0.5, 0); controls.enableDamping = true;

      const host = await loadCharacter(THREE, GLTFLoader, "character.glb", { height: 1, paint: SHICHI_PAINT, envIntensity: 0.7 });
      scene.add(host.root);
      const clipNames = host.clips.map((c) => c.name);
      document.getElementById("info").textContent =
        `Clips: ${clipNames.length ? clipNames.join(", ") : "none (static model, procedural motion)"} · skeleton: ${host.skinned ? "yes" : "no"} · textures: ${host.textured ? "yes" : "no"}`;

      const STATES = ["Idle", "Talking", "Pointing", "Cheer"];
      const ui = document.getElementById("ui");
      const buttons = STATES.map((s, i) => {
        const b = document.createElement("button"); b.textContent = `${i + 1} · ${s}`; b.onclick = () => go(s); ui.appendChild(b); return b;
      });
      function go(s) { host.play(s); buttons.forEach((b, i) => b.classList.toggle("on", STATES[i] === s)); }
      addEventListener("keydown", (e) => { const i = Number(e.key) - 1; if (STATES[i]) go(STATES[i]); });
      go("Idle");

      const clock = new THREE.Clock();
      function resize() {
        const w = innerWidth, h = innerHeight;
        renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize); resize();
      renderer.setAnimationLoop(() => {
        host.update(clock.getDelta()); // AnimationMixer + procedural layer advance by real elapsed time
        controls.update();
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
